<!DOCTYPE HTML>
<htlm xmlns:th = "https://www.thymeleaf.org">
	<head>
		<meta charset="UTF-8">
		<title>Alta de Inmueble</title>
		<meta name="viewport" content="width=device-width, initial-scale=1">
		  
		<!-- Bootstrap -->
		<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
	</head>
	<body class="bg-light">

	<div class="container vh-100 d-flex justify-content-center align-items-center">
	  <div class="card shadow p-4" style="width: 100%; max-width: 700px;">
	    
	    <h3 class="text-center mb-4">Alta de Inmueble</h3>
	
	    <form action="#" th:action="@{/propietario/alta-inmueble}" th:object="${inmueble}" method="post">
	
	      <!-- 🏠 DIRECCIÓN -->
	      <div class="mb-4 p-3 border rounded">
	        <h5 class="mb-3">Dirección</h5>
	
	        <div class="mb-3">
	          <div class="input-group">
	            <select class="form-select" style="max-width: 150px;" th:field="*{direccion.base.tipoCalle}">
	              <option th:each="tipo : ${tipoCalle}" th:value="${tipo}" th:text="${tipo}"></option>
	            </select>
	            <input th:field="*{direccion.base.calle}" type="text" class="form-control required" placeholder="Nombre de la calle*" required>
	          </div>
	        </div>
	
	        <div class="row mb-3">
	          <div class="col">
	            <input th:field="*{direccion.numero}" type="text" class="form-control" placeholder="Número*" required>
	          </div>
	          <div class="col">
	            <input th:field="*{direccion.piso}" type="text" class="form-control" placeholder="Piso">
	          </div>
	          <div class="col">
	            <input th:field="*{direccion.puerta}" type="text" class="form-control" placeholder="Puerta">
	          </div>
	        </div>
	
	        <div class="row mb-3">
	          <div class="col">
	            <input th:field="*{direccion.base.ciudad}" type="text" class="form-control" placeholder="Ciudad*" required>
	          </div>
	          <div class="col">
	            <input th:field="*{direccion.base.estado}" type="text" class="form-control" placeholder="Provincia*" required>
	          </div>
	          <div class="col">
	            <input th:field="*{direccion.base.pais}" type="text" class="form-control" placeholder="País*" required>
	          </div>
	        </div>
	        <div class="row mb-3">
	          <div class="col">
	            <input th:field="*{direccion.base.codigoPostal}" type="text" class="form-control" placeholder="Código Postal*" required>
	          </div>
	        </div>
	      </div>
	
	      <!-- 🛏️ COMODIDADES -->
	      <div class="mb-4 p-3 border rounded">
	        <h5 class="mb-3">Comodidades</h5>
	
	        <div class="row">
	          <div class="col-md-6">
	            <div class="form-check" th:each="comodidad : ${comodidades}">
	              <input th:name="comodidadesSeleccionadas" class="form-check-input" type="checkbox" id="'comodidad-'+${comodidad.id}">
	              <label class="form-check-label" for="'comodidad-'+${comodidad.id}" th:text="${comodidad.nombre}"></label>
	            </div>
	          </div>
	        </div>
	      </div>
	
	      <!-- 💰 PRECIO -->
	      <div class="mb-4 p-3 border rounded">
	        <h5 class="mb-3">Precio*</h5>
	
	        <div class="row">
	          <div class="col">
	            <input th:field="*{precioNoche}" type="number" class="form-control" placeholder="Precio por noche (€)" required>
	          </div>
	        </div>
	      </div>
	
	      <!-- BOTONES -->
	      <div class="d-flex gap-2">
	        <button type="submit" class="btn btn-primary w-100">Guardar</button>
	        <button type="button" class="btn btn-danger w-100">Cancelar</button>
	      </div>
	
	    </form>
	  </div>
	</div>

</body>
</html>
