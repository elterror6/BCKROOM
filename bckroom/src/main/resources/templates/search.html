<!DOCTYPE HTML>
<html xmlns:th="https://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">

    <!-- Fuentes y estilos -->
    <link href="https://fonts.googleapis.com/css2?family=Exo&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <style>
        body {
            font-family: 'Exo', sans-serif;
        }
    </style>
</head>

<body class="search-body">

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<!-- ❤️ FAVORITOS -->
<script>
function toggleFavorito(id, btn) {
    fetch('/deseados/toggle/' + id, {
        method: 'POST'
    });

    const icon = btn.querySelector('i');

    if (icon.classList.contains('bi-heart')) {
        icon.classList.remove('bi-heart');
        icon.classList.add('bi-heart-fill');
    } else {
        icon.classList.remove('bi-heart-fill');
        icon.classList.add('bi-heart');
    }
}
</script>

<!-- ⚡ FILTROS DINÁMICOS -->
<script>
document.addEventListener("DOMContentLoaded", () => {
    document.querySelectorAll('.filtro').forEach(f => {
        f.addEventListener('change', aplicarFiltros);
    });
});

function aplicarFiltros() {

    const reservaInmediata = document.getElementById('reservaInmediata')?.checked;

    const comodidades = Array.from(document.querySelectorAll('input[name="comodidades"]:checked'))
        .map(el => el.value);

    const politicas = Array.from(document.querySelectorAll('input[name="politicas"]:checked'))
        .map(el => el.value);

    // 🔹 NUEVO: coger fechas del buscador
	const fechaInicio = document.getElementById('fechaInicio').value;
	const fechaFin = document.getElementById('fechaFin').value;

    // 🔹 NUEVO: fetch con params
    fetch(`/buscar/filtrar?fechaInicio=${fechaInicio}&fechaFin=${fechaFin}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
            reservaInmediata: reservaInmediata,
            comodidades: comodidades,
            politicas: politicas
        })
    })
    .then(res => res.text())
    .then(html => {
        document.getElementById('resultadosContainer').innerHTML = html;
    });
}
</script>

<!-- 🔝 HEADER -->
<div class="container">
    <div class="row align-items-center">

        <!-- LOGO -->
        <div class="col-3">
            <h1>BCKROOM</h1>
        </div>

        <!-- BUSCADOR -->
        <div class="col">
            <form class="input-group">
                <input type="text"
                       class="form-control rounded-0 rounded-start border-end-0"
                       placeholder="Destino"
                       th:value="${ciudad}">

                <input type="date"
                       class="form-control rounded-0 border-end-0"
                       th:value="${fechaInicio}" id="fechaInicio">

                <span class="input-group-text bg-white"> - </span>

                <input type="date"
                       class="form-control rounded-0 border-start-0 border-end-0"
                       th:value="${fechaFinal}" id="fechaFin">

                <input type="number"
                       class="form-control rounded-0 border-end-0"
                       placeholder="mín €"
                       th:value="${precioMin}"
                       min="0">

                <span class="input-group-text bg-white"> - </span>

                <input type="number"
                       class="form-control rounded-0 border-start-0 border-end-0"
                       placeholder="máx €"
                       th:value="${precioMax}"
                       min="0">

                <button class="btn btn-primary rounded-0 rounded-end">
                    Buscar
                </button>
            </form>
        </div>

        <!-- USUARIO -->
        <div class="col-3">
            <div class="d-flex justify-content-end">
                <div class="btn-group">

                    <!-- Usuario logueado -->
                    <span th:if="${usuario != null}">
                        <button class="btn btn-primary"
                                th:text="${usuario.username}"
                                th:onclick="'location.href=\'/profile/' + ${usuario.id} + '\''"></button>

                        <button class="btn btn-primary"
                                onclick="location.href='/logout'">
                            Cerrar Sesión
                        </button>
                    </span>

                    <!-- Usuario no logueado -->
                    <span th:if="${usuario == null}">
                        <button class="btn btn-primary"
                                onclick="location.href='/login'">
                            Iniciar Sesión
                        </button>

                        <button class="btn btn-primary"
                                onclick="location.href='/register'">
                            Registrarse
                        </button>
                    </span>

                </div>
            </div>
        </div>
    </div>
</div>

<!-- 🧱 CONTENIDO PRINCIPAL -->
<div class="container-fluid mt-4">
    <div class="row">

        <!-- 🔹 FILTROS -->
        <div class="col-3 border-end">

            <h5>Filtros</h5>

            <!-- Tipo de reserva -->
            <div class="mb-3">
                <label class="form-label">Tipo de reserva</label>
                <div class="form-check">
                    <input class="form-check-input filtro"
                           type="checkbox"
                           id="reservaInmediata">
                    <label class="form-check-label">
                        Reserva inmediata
                    </label>
                </div>
            </div>

            <!-- Comodidades -->
            <div class="mb-3">
                <label class="form-label">Comodidades</label>

                <div th:each="comodidad : ${comodidades}">
                    <div class="form-check">
                        <input class="form-check-input filtro"
                               type="checkbox"
                               th:value="${comodidad.id}"
                               name="comodidades">

                        <label class="form-check-label"
                               th:text="${comodidad.nombre}"></label>
                    </div>
                </div>
            </div>

            <!-- Políticas -->
            <div class="mb-3">
                <label class="form-label">Cancelación</label>

                <div th:each="politica : ${politicas}">
                    <div class="form-check">
                        <input class="form-check-input filtro"
                               type="checkbox"
                               th:value="${politica.id}"
                               name="politicas">

                        <label class="form-check-label"
                               th:text="${politica.nombre}"></label>
                    </div>
                </div>
            </div>

        </div>

        <!-- 🔹 RESULTADOS -->
        <div class="col-9">
            <div class="row" id="resultadosContainer">

                <div class="col-4 mb-3"
                     th:each="inmueble : ${resultados}">

                    <div class="card">
                        <div class="card-body">

                            <h5 class="card-title"
                                th:text="${inmueble.direccion}"></h5>

                            <p class="card-text"
                               th:text="${inmueble.direccion.base.ciudad}+', '+${inmueble.direccion.base.estado}"></p>

                            <!-- ❤️ Favorito -->
                            <button type="button"
                                    class="btn btn-primary"
                                    th:onclick="'toggleFavorito(' + ${inmueble.id} + ', this)'">

                                <i th:class="${deseados.contains(inmueble)} ? 'bi bi-heart-fill' : 'bi bi-heart'"></i>
                            </button>

                            <!-- Reservar -->
                            <a href="#" class="btn btn-primary">
                                Reservar
                            </a>

                        </div>
                    </div>

                </div>

            </div>
        </div>

    </div>
</div>

</body>
</html>
