<!DOCTYPE HTML>
<html xmlns:th = "https://www.thymeleaf.org">
	<head>
		<link href="https://fonts.googleapis.com/css2?family=Exo&display=swap" rel="stylesheet">
		<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
		<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
		<meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/>
	</head>
	<body class="search-body">
		<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
		<script>
		function toggleFavorito(id, btn) {
		    fetch('/deseados/toggle/' + id, {
		        method: 'POST'
		    });

		    const icon = btn.querySelector('i');

		    if (icon.classList.contains('bi-heart')) {
		        icon.classList.remove('bi-heart');
		        icon.classList.add('bi-heart-fill');
		    } else {
		        icon.classList.remove('bi-heart-fill');
		        icon.classList.add('bi-heart');
		    }
		}
		</script>
		<!--CONTENEDOR HEADER-->
		<div class="container">
			<div class="row align-items-center">
				<!--COLUMNA LOGO-->
				<div class="col-3">
	      			<h1>BCKROOM</h1>
				</div>
				<!--COLUMNA BARRA DE BÚSQUEDA-->
			    <div class="col">
			      <form class="input-group">
			        <input type="text"
			               class="form-control rounded-0 rounded-start border-end-0"
			               placeholder="Destino"
						   th:value="${ciudad}">
			
			        <input type="date"
			               class="form-control rounded-0 border-end-0"
						   th:value="${fechaInicio}">
			        <span class="input-group-text bg-white" id="basic-addon1"> - </span>
			        <input type="date"
			               class="form-control rounded-0 border-start-0 border-end-0"
						   th:value="${fechaFinal}">
			        
			        <input type="number"
			          class="form-control rounded-0 border-end-0"
			          placeholder="mín €"
					  th:value="${precioMin}"
					  min="0">
			        <span class="input-group-text bg-white" id="basic-addon1"> - </span>
			        <input type="number"
			          class="form-control rounded-0 border-start-0 border-end-0"
			          placeholder="máx €"
					  th:value="${precioMax}"
					  min="0">
			          
			        <button class="btn btn-primary rounded-0 rounded-end">
			          Buscar
			        </button>
			      </form>
				</div>
				<!--COLUMNA USUARIO-->
			    <div class="col-3">
			      <div class="d-flex justify-content-end">
			        <div class="btn-group">
						<!--Si el usuario existe-->
						<span th:if="${usuario != null}">
							
							<button class="btn btn-primary"
							th:text="${usuario.username}"
							th:onclick="'location.href=\'/profile/' + ${usuario.id} + '\''"></button>
							<button class="btn btn-primary"
							onclick="location.href='/logout'">Cerrar Sesión</button>
						</span>
						<!--Si el usuario no existe-->
						<span th:if="${usuario == null}">
							<button class="btn btn-primary"
							onclick="location.href='/login'">Iniciar Sesión</button>
							<button class="btn btn-primary"
							onclick="location.href='/register'">Registrarse</button>
						</span>
	
			        </div>
			      </div>
			    </div>
			</div>
		</div>
		<div class="container m-4">
			<div class="row align-items-center">
		        <div class="col" th:each="inmueble : ${resultados}">
		          <div class="card">
		            <div class="card-body">
		              <h5 class="card-title" th:text="${inmueble.direccion}"></h5>
		              <p class="card-text" th:text="${inmueble.direccion.base.ciudad}+', '+${inmueble.direccion.base.estado}"></p>
					  <button type="button" class="btn btn-primary"
					  th:onclick="'toggleFavorito(' + ${inmueble.id} + ', this)'">
					      <i th:class="${deseados.contains(inmueble)} ? 'bi bi-heart-fill' : 'bi bi-heart'"></i>
					  </button>
		              <a href="#" class="btn btn-primary">Reservar</a>
		            </div>
		          </div>
		        </div>
		      </div>
		</div>
	</body>
</html>
